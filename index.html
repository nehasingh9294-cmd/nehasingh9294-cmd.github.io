
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joining Day Tracker</title>
<style>
body{font-family:Arial;background:#f2f5f9;padding:18px;color:#222}
h1{color:#24527a}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px}
button{background:#24527a;color:white;padding:10px;border:0;border-radius:6px}
label{display:block;padding:9px}
</style>
</head>
<body>
<h1>HR Joining-Day Tracker</h1>
<p>Fictional sample records for HR practice.</p>
<div class="card">
<h3>Add a joiner</h3>
<input id="person" placeholder="Joiner name"><br><br>
<input id="role" placeholder="Job role"><br><br>
<button onclick="add()">Add joiner</button>
</div>
<div id="list"></div>
<script>
let tasks=["Offer accepted","BGV completed","Documents received","Laptop ready","System access ready","Buddy assigned","Induction scheduled"];
let people=[
{name:"Aarav Mehta",role:"Java Developer"},
{name:"Mira Shah",role:"React Developer"},
{name:"Kabir Rao",role:"QA Engineer"}
];
function add(){
let n=document.getElementById("person").value;
let r=document.getElementById("role").value;
if(!n||!r){alert("Enter name and role");return}
people.push({name:n,role:r});
render();
}
function render(){
document.getElementById("list").innerHTML=people.map((p,i)=>`
<div class="card">
<h3>${p.name}</h3><p>${p.role}</p>
${tasks.map(t=>`<label><input type="checkbox"> ${t}</label>`).join("")}
</div>`).join("");
}
render();
</script>
</body>
</html>
